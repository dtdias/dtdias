<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Daniel Trajano Dias, Full Stack Developer</title>
  <desc id="description">Vibrant navy and coral technology banner with Daniel Trajano Dias name and full stack development focus.</desc>
  <defs>
    <linearGradient id="background" x1="48" y1="24" x2="1160" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131F" />
      <stop offset="0.52" stop-color="#09131B" />
      <stop offset="1" stop-color="#102A3A" />
    </linearGradient>
    <linearGradient id="accent" x1="176" y1="48" x2="1012" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF652F" />
      <stop offset="0.52" stop-color="#FFE400" />
      <stop offset="1" stop-color="#FF8A65" />
    </linearGradient>
    <radialGradient id="coralGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(104 26) rotate(50) scale(330 300)">
      <stop stop-color="#FF652F" stop-opacity="0.42" />
      <stop offset="1" stop-color="#FF652F" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1088 292) rotate(-140) scale(330 250)">
      <stop stop-color="#FFE400" stop-opacity="0.25" />
      <stop offset="1" stop-color="#FFE400" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFE400" stroke-opacity="0.08" />
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="320" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#background)" />
    <rect width="1200" height="320" fill="url(#grid)" />
    <rect width="1200" height="320" fill="url(#coralGlow)" />
    <rect width="1200" height="320" fill="url(#goldGlow)" />

    <circle cx="1020" cy="-28" r="126" fill="#FF652F" fill-opacity="0.24" filter="url(#blur)" />
    <circle cx="1140" cy="266" r="90" fill="#FFE400" fill-opacity="0.16" filter="url(#blur)" />
    <circle cx="842" cy="84" r="3" fill="#FFFFFF" />
    <circle cx="910" cy="50" r="2" fill="#FFE400" />
    <circle cx="1068" cy="158" r="3" fill="#FF652F" />
    <circle cx="988" cy="242" r="2" fill="#FF8A65" />

    <path d="M748 320C798 258 792 184 864 134C930 88 1012 110 1086 48C1122 18 1158 2 1200 -8" stroke="url(#accent)" stroke-opacity="0.8" stroke-width="2" />
    <path d="M784 320C830 266 830 214 894 172C964 126 1034 148 1092 100C1132 68 1162 48 1200 42" stroke="#FFE400" stroke-opacity="0.2" />
    <path d="M828 320C874 282 884 240 934 210C988 178 1042 194 1098 160C1146 130 1170 116 1200 112" stroke="#FF652F" stroke-opacity="0.25" />

    <rect x="64" y="54" width="52" height="4" rx="2" fill="url(#accent)" />
    <text x="64" y="150" fill="#FFFFFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="700" letter-spacing="1">DANIEL TRAJANO DIAS</text>
    <text x="68" y="194" fill="#FFB4A0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" letter-spacing="4">FULL STACK DEVELOPER</text>
    <text x="68" y="238" fill="#D7E3ED" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" letter-spacing="1">produtos web  ·  automação  ·  sistemas confiáveis</text>

    <g transform="translate(1030 218) rotate(-16)">
      <rect x="0" y="0" width="94" height="62" rx="12" fill="#09131B" fill-opacity="0.78" stroke="#FFB4A0" stroke-opacity="0.3" />
      <path d="M26 22L38 31L26 40" stroke="#FFE400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M48 42H68" stroke="#FF652F" stroke-width="3" stroke-linecap="round" />
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="23" stroke="#FFB4A0" stroke-opacity="0.2" stroke-width="2" />
</svg>
