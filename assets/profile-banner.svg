<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Daniel Trajano Dias, Software Engineer</title>
  <desc id="description">Vibrant dark technology banner with Daniel Trajano Dias name and software engineering focus.</desc>
  <defs>
    <linearGradient id="background" x1="48" y1="24" x2="1160" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D1A" />
      <stop offset="0.52" stop-color="#151031" />
      <stop offset="1" stop-color="#071C2B" />
    </linearGradient>
    <linearGradient id="accent" x1="176" y1="48" x2="1012" y2="264" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A855F7" />
      <stop offset="0.52" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#F97316" />
    </linearGradient>
    <radialGradient id="violetGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(104 26) rotate(50) scale(330 300)">
      <stop stop-color="#7C3AED" stop-opacity="0.48" />
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1088 292) rotate(-140) scale(330 250)">
      <stop stop-color="#06B6D4" stop-opacity="0.38" />
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>
    <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
