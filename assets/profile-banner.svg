    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#C4B5FD" stroke-opacity="0.08" />
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="320" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#background)" />
    <rect width="1200" height="320" fill="url(#grid)" />
    <rect width="1200" height="320" fill="url(#violetGlow)" />
    <rect width="1200" height="320" fill="url(#cyanGlow)" />

    <circle cx="1020" cy="-28" r="126" fill="#A855F7" fill-opacity="0.24" filter="url(#blur)" />
    <circle cx="1140" cy="266" r="90" fill="#22D3EE" fill-opacity="0.2" filter="url(#blur)" />
    <circle cx="842" cy="84" r="3" fill="#F8FAFC" />
    <circle cx="910" cy="50" r="2" fill="#22D3EE" />
    <circle cx="1068" cy="158" r="3" fill="#F97316" />
    <circle cx="988" cy="242" r="2" fill="#A855F7" />

    <path d="M748 320C798 258 792 184 864 134C930 88 1012 110 1086 48C1122 18 1158 2 1200 -8" stroke="url(#accent)" stroke-opacity="0.8" stroke-width="2" />
    <path d="M784 320C830 266 830 214 894 172C964 126 1034 148 1092 100C1132 68 1162 48 1200 42" stroke="#22D3EE" stroke-opacity="0.2" />
    <path d="M828 320C874 282 884 240 934 210C988 178 1042 194 1098 160C1146 130 1170 116 1200 112" stroke="#F97316" stroke-opacity="0.25" />

    <rect x="64" y="54" width="52" height="4" rx="2" fill="url(#accent)" />
    <text x="64" y="150" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="44" font-weight="700" letter-spacing="1">DANIEL TRAJANO DIAS</text>
    <text x="68" y="194" fill="#A8B3CF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" letter-spacing="4">SOFTWARE ENGINEER</text>
    <text x="68" y="238" fill="#E2E8F0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" letter-spacing="1">web products  ·  automation  ·  reliable systems</text>

    <g transform="translate(1030 218) rotate(-16)">
      <rect x="0" y="0" width="94" height="62" rx="12" fill="#0B1020" fill-opacity="0.74" stroke="#C4B5FD" stroke-opacity="0.3" />
      <path d="M26 22L38 31L26 40" stroke="#22D3EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M48 42H68" stroke="#F97316" stroke-width="3" stroke-linecap="round" />
