<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200"><style>
@keyframes gpsc-fade{from{opacity:0}to{opacity:1}}
@keyframes gpsc-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes gpsc-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes gpsc-pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes gpsc-wipe{from{transform:translateX(calc(-1 * var(--gpsc-w,420px)))}to{transform:translateX(0)}}
@keyframes gpsc-tint{from{filter:sepia(.7) saturate(4) hue-rotate(-70deg)}to{filter:sepia(0) saturate(1) hue-rotate(0)}}
@keyframes gpsc-rgb{0%{filter:hue-rotate(0deg) saturate(1)}50%{filter:hue-rotate(180deg) saturate(1.7)}100%{filter:hue-rotate(360deg) saturate(1)}}.gpsc-item{animation:gpsc-fade 1s ease both calc(var(--gpsc-i,0) * 0.15s)}.arc{animation:gpsc-pop 1s ease both 1.125s;transform-box:fill-box;transform-origin:center}rect.bar{animation:gpsc-grow 1.25s cubic-bezier(.2,.7,.3,1) both 1.125s;transform-box:fill-box;transform-origin:center bottom}.gpsc-reveal{animation:gpsc-wipe 1.5s linear both 1s}@media (prefers-reduced-motion:reduce){.gpsc-root,.gpsc-root *,.gpsc-item,.gpsc-chart,rect.bar,.arc,.gpsc-reveal{animation:none!important}}</style><style>* {
          font-family: 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif
        }</style><g class="gpsc-root"><rect x="1" y="1" rx="5" ry="5" height="99%" width="99.41176470588235%" stroke="#0c1a25" stroke-width="1" fill="#09131b" stroke-opacity="1"></rect><text x="30" y="40" class="gpsc-item" style="--gpsc-i: 0; font-size: 22px; fill: #ff652f;">Top Languages by Commit</text><g transform="translate(0,40)"><g transform="translate(40,0)"><rect y="18" width="14" height="14" class="gpsc-item" style="--gpsc-i: 0; stroke-width: 1px;" fill="#3178c6" stroke="#09131b"></rect><rect y="43.2" width="14" height="14" class="gpsc-item" style="--gpsc-i: 1; stroke-width: 1px;" fill="#3572A5" stroke="#09131b"></rect><rect y="68.4" width="14" height="14" class="gpsc-item" style="--gpsc-i: 2; stroke-width: 1px;" fill="#a91e50" stroke="#09131b"></rect><text x="16.8" y="30" class="gpsc-item" style="--gpsc-i: 0; fill: #ffffff; font-size: 14px;">TypeScript</text><text x="16.8" y="55.2" class="gpsc-item" style="--gpsc-i: 1; fill: #ffffff; font-size: 14px;">Python</text><text x="16.8" y="80.4" class="gpsc-item" style="--gpsc-i: 2; fill: #ffffff; font-size: 14px;">EJS</text></g><g transform="translate( 230, 80 )"><g class="arc" style="--gpsc-i: 0;"><path d="M0,-60A60,60,0,1,1,-46.073,-38.436L-26.876,-22.421A35,35,0,1,0,0,-35Z" style="fill: #3178c6; stroke-width: 2px;" stroke="#09131b"></path></g><g class="arc" style="--gpsc-i: 1;"><path d="M-46.073,-38.436A60,60,0,0,1,-2.06,-59.965L-1.201,-34.979A35,35,0,0,0,-26.876,-22.421Z" style="fill: #3572A5; stroke-width: 2px;" stroke="#09131b"></path></g><g class="arc" style="--gpsc-i: 2;"><path d="M-2.06,-59.965A60,60,0,0,1,0,-60L0,-35A35,35,0,0,0,-1.201,-34.979Z" style="fill: #a91e50; stroke-width: 2px;" stroke="#09131b"></path></g></g></g></g></svg>